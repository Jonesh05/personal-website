<svg viewBox="0 0 260 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284C7;stop-opacity:1" />
      <stop offset="52%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brandTagline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFB2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon Box with JP -->
  <g transform="translate(0, 3)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#brandBadge)"/>
    <rect x="0.75" y="0.75" width="42.5" height="42.5" rx="10.25" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
    <text
      font-family="system-ui, -apple-system, sans-serif"
      font-size="20"
      font-weight="800"
      fill="#FFFFFF"
      x="22"
      y="29.5"
      text-anchor="middle"
      letter-spacing="-0.5"
    >
      JP
    </text>
    <!-- Blockchain connection nodes -->
    <circle cx="6.5" cy="6.5" r="2.2" fill="#E0F2FE" opacity="0.9"/>
    <circle cx="37.5" cy="37.5" r="2.2" fill="#D1FAE5" opacity="0.9"/>
    <circle cx="6.5" cy="37.5" r="1.4" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="37.5" cy="6.5" r="1.4" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Main Name -->
  <text
    font-family="system-ui, -apple-system, sans-serif"
    font-size="23.5"
    font-weight="800"
    fill="#F1F5F9"
    x="53"
    y="27.5"
    letter-spacing="-0.5"
    style="text-shadow: 0 1px 4px rgba(2, 6, 23, 0.55);"
  >
    Jhonny Pimiento
  </text>

  <!-- Tagline -->
  <text
    font-family="system-ui, -apple-system, sans-serif"
    font-size="9.8"
    font-weight="700"
    fill="url(#brandTagline)"
    x="53"
    y="41.5"
    letter-spacing="1.6"
  >
    WEB3 • BLOCKCHAIN • DEV
  </text>
</svg>
